<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Ktimes Media</title>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    
    /* Splash Screen - ३ सेकंदांत आपोआप गायब होईल */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: white; display: flex; align-items: center; justify-content: center;
      animation: hideSplash 1s ease 2s forwards;
    }
    .k-dial { 
      width: 100px; height: 100px; background: #dc2626; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 50px; font-weight: bold; border: 4px solid white;
    }
    @keyframes hideSplash { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="k-dial">K</div>
  </div>

  <!-- Main Content -->
  <div style="padding: 20px;">
    <h1>Ktimes Media</h1>
    <p>जर तुम्हाला हे दिसत असेल, तर ॲप आता व्यवस्थित काम करत आहे!</p>
  </div>

  <script>
    // एकदा वेबसाईट लोड झाली की हे आपोआप चालणार
    console.log("App Loaded Successfully");
  </script>
</body>
</html>
