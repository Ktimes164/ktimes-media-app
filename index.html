<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ktimes Media | Official App</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Mukta', sans-serif; }
    .baloo-k { font-family: 'Baloo 2', sans-serif; }
    .ktimes-dial { background: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; color: white; }
  </style>
</head>
<body class="bg-slate-50 pb-24">

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2"><div class="ktimes-dial w-9 h-9"><span class="baloo-k text-xl italic">K</span></div>
      <h1 class="font-bold text-lg">Ktimes <span class="text-red-600">Media</span></h1></div>
      <div class="flex gap-2">
        <!-- हे बटण फक्त मोबाईलवर आणि सपोर्टेड ब्राउझरवर दिसेल -->
        <button id="pwaInstallBtn" onclick="installKtimesApp()" class="hidden bg-emerald-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold shadow animate-pulse">⬇️ इन्स्टॉल</button>
        <button onclick="openAdminModal()" class="px-3 py-1 bg-red-700 text-white rounded-lg text-xs font-bold">Admin</button>
      </div>
    </div>
  </header>

  <!-- Banner (Clean & Simple) -->
  <section class="max-w-4xl mx-auto px-4 pt-4">
    <div class="bg-red-700 p-6 rounded-2xl text-white shadow-lg text-center">
        <h2 class="baloo-k text-2xl font-black mb-2">फेस्टिव्हल ऑफर - ३०% सूट!</h2>
        <p class="text-sm font-semibold opacity-90 mb-4">आमच्या सर्व ऑडिओ आणि व्हिडिओ जाहिरातींवर खास सवलत.</p>
        <a href="tel:9422337471" class="inline-block bg-white text-red-700 px-6 py-2 rounded-xl font-black text-sm">आत्ताच कॉल करा</a>
    </div>
  </section>

  <main class="max-w-4xl mx-auto px-4 py-4 grid grid-cols-1 md:grid-cols-2 gap-4" id="samplesGrid"></main>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm">
        <div class="bg-red-700 p-4 rounded-t-2xl text-white font-bold">Admin Panel</div>
        <div class="p-5">
            <input type="password" id="adminPinInput" placeholder="PIN" class="w-full p-2 border mb-2 text-center text-lg">
            <button onclick="verifyAdminPin()" class="w-full bg-red-700 text-white p-2 rounded">Login</button>
            <div id="adminUnlockedArea" class="hidden mt-4 space-y-2">
                <input type="text" id="sampleTitle" placeholder="Title" class="w-full p-2 border">
                <input type="text" id="sampleUrl" placeholder="YouTube Video ID" class="w-full p-2 border">
                <button onclick="handleSave()" class="w-full bg-green-600 text-white p-2">Save</button>
            </div>
        </div>
    </div>
  </div>

  <script>
    let samples = JSON.parse(localStorage.getItem('ktimes_samples_db')) || [{id:'s1', title:'गणेश ज्वेलर्स', vid:'dQw4w9WgXcQ', views:1420, likes:184}];
    let deferredPrompt;

    function renderSamples() {
      document.getElementById('samplesGrid').innerHTML = samples.map(s => `
        <div class="bg-white p-4 rounded-xl border shadow-sm">
           <h3 class="font-bold text-sm mb-2">${s.title}</h3>
           <iframe class="w-full aspect-video rounded-lg" src="https://www.youtube.com/embed/${s.vid}"></iframe>
           <div class="flex justify-between mt-3 text-xs font-bold text-slate-500">
             <span>👁️ ${s.views}</span> <span>❤️ ${s.likes}</span>
           </div>
        </div>
      `).join('');
    }

    function handleSave() {
        samples.unshift({id:'s'+Date.now(), title:document.getElementById('sampleTitle').value, vid:document.getElementById('sampleUrl').value, views:0, likes:0});
        localStorage.setItem('ktimes_samples_db', JSON.stringify(samples));
        renderSamples();
    }

    function verifyAdminPin() {
      if(document.getElementById('adminPinInput').value === '7171') document.getElementById('adminUnlockedArea').classList.remove('hidden');
      else alert('Wrong PIN');
    }

    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('pwaInstallBtn').classList.remove('hidden'); });
    function installKtimesApp() { if(deferredPrompt) deferredPrompt.prompt(); }

    window.onload = () => { renderSamples(); };
  </script>
</body>
</html>
