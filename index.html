<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ktimes Media | Professional Audio & Ad Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Mukta', sans-serif; }
    .baloo-k { font-family: 'Baloo 2', sans-serif; font-weight: 900; }
    .ktimes-dial { background: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; }
    #splash-screen { position: fixed; inset: 0; z-index: 9999; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-slate-50 pb-24 md:pb-6">

  <!-- Splash -->
  <div id="splash-screen"><div class="ktimes-dial w-24 h-24 ring-4 ring-red-100"><span class="baloo-k text-white text-6xl italic">K</span></div></div>

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2"><div class="ktimes-dial w-9 h-9"><span class="baloo-k text-white text-xl italic">K</span></div>
      <h1 class="font-bold text-lg">Ktimes <span class="text-red-600">Media</span></h1></div>
      <button onclick="openAdminModal()" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs font-bold">Admin</button>
    </div>
    <!-- Social Bar -->
    <div class="px-4 py-2 flex items-center justify-center gap-4 bg-slate-50 border-t" id="socialIconsBar"></div>
  </header>

  <!-- Banner -->
  <section class="max-w-4xl mx-auto px-4 pt-4" id="offerBannerSection"></section>

  <!-- Categories -->
  <section class="max-w-4xl mx-auto px-4 py-3"><div class="flex gap-2 overflow-x-auto" id="categoryTabsContainer"></div></section>

  <!-- Samples -->
  <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-4" id="samplesGrid"></main>

  <!-- Mobile Nav -->
  <div class="md:hidden fixed bottom-0 w-full bg-white border-t p-2 flex justify-around z-50 shadow-lg">
    <button onclick="filterCategoryBySlug('Audio')" class="flex flex-col items-center text-xs font-bold"><i data-lucide="mic" class="w-5 h-5 text-red-600"></i> ऑडिओ</button>
    <button onclick="filterCategoryBySlug('Video')" class="flex flex-col items-center text-xs font-bold"><i data-lucide="video" class="w-5 h-5 text-purple-600"></i> व्हिडिओ</button>
    <button onclick="window.scrollTo(0,0)" class="flex flex-col items-center text-xs font-bold"><div class="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center"><i data-lucide="home" class="w-4 h-4"></i></div></button>
    <button onclick="filterCategoryBySlug('Jingle')" class="flex flex-col items-center text-xs font-bold"><i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i> जिंगल्स</button>
    <a href="tel:9422337471" class="flex flex-col items-center text-xs font-bold"><i data-lucide="phone" class="w-5 h-5 text-emerald-600"></i> कॉल</a>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 max-h-[80vh] overflow-y-auto">
        <h2 class="font-bold mb-4">Admin Panel</h2>
        <input type="password" id="adminPinInput" placeholder="PIN" class="w-full p-2 border mb-2">
        <button onclick="verifyAdminPin()" class="w-full bg-red-600 text-white p-2 rounded">Login</button>
        <div id="adminUnlockedArea" class="hidden mt-4 space-y-2">
            <input type="text" id="sampleTitle" placeholder="Title" class="w-full p-2 border">
            <input type="text" id="sampleMediaUrl" placeholder="URL" class="w-full p-2 border">
            <button onclick="handleSaveSample()" class="w-full bg-green-600 text-white p-2">Save Sample</button>
        </div>
    </div>
  </div>

  <script>
    let samples = JSON.parse(localStorage.getItem('ktimes_samples_db')) || [{id:'s1', title:'गणेश ज्वेलर्स', category:'Video', url:'https://www.youtube.com/watch?v=dQw4w9WgXcQ', views:1420, likes:184}];
    let socialLinks = JSON.parse(localStorage.getItem('ktimes_socials_db')) || {wa:'https://wa.me/9422337471', fb:'#', yt:'#'};

    function renderSocialIconsBar() {
      document.getElementById('socialIconsBar').innerHTML = `
        <div class="text-[10px] font-bold border-r pr-2">📍 सातारा</div>
        <a href="${socialLinks.wa}"><img src="https://cdn-icons-png.flaticon.com/64/3670/3670051.png" class="w-7 h-7"></a>
        <a href="${socialLinks.fb}"><img src="https://cdn-icons-png.flaticon.com/64/1384/1384053.png" class="w-7 h-7"></a>
        <a href="${socialLinks.yt}"><img src="https://cdn-icons-png.flaticon.com/64/1384/1384060.png" class="w-7 h-7"></a>
      `;
    }

    function renderSamples() {
      document.getElementById('samplesGrid').innerHTML = samples.map(s => `
        <div class="bg-white p-4 rounded-xl border shadow-sm">
           <h3 class="font-bold text-sm mb-2">${s.title}</h3>
           <div class="aspect-video bg-black rounded-lg mb-3"></div>
           <div class="flex justify-between text-xs font-bold">
             <span class="text-blue-600">👁️ ${s.views}</span>
             <span class="text-rose-600">❤️ ${s.likes}</span>
           </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function verifyAdminPin() {
      if(document.getElementById('adminPinInput').value === '7171') {
        document.getElementById('adminUnlockedArea').classList.remove('hidden');
      } else { alert('Wrong PIN'); }
    }

    function handleSaveSample() {
      const title = document.getElementById('sampleTitle').value;
      samples.unshift({id:'s'+Date.now(), title:title, views:0, likes:0});
      localStorage.setItem('ktimes_samples_db', JSON.stringify(samples));
      renderSamples();
    }

    window.onload = () => {
      renderSocialIconsBar();
      renderSamples();
      setTimeout(() => document.getElementById('splash-screen').classList.add('hide-splash'), 1000);
      lucide.createIcons();
    };
  </script>
</body>
</html>
