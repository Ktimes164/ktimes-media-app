<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Ktimes Media | Official Studio</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#dc2626">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts: Baloo 2 & Mukta -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Mukta', sans-serif; -webkit-tap-highlight-color: transparent; }
    .baloo-k { font-family: 'Baloo 2', sans-serif; }
    .ktimes-dial {
      background: #dc2626; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid white; color: white;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-24 md:pb-8">

  <!-- 1. HEADER -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="ktimes-dial w-9 h-9 shrink-0">
          <span class="baloo-k text-xl font-black italic">K</span>
        </div>
        <div>
          <h1 class="text-base font-bold leading-none">
            <span class="text-red-600">Ktimes</span> <span class="text-slate-950">Media</span>
          </h1>
          <p class="text-[9px] font-semibold text-slate-500 mt-0.5">Audio & Ad Production</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="pwaInstallBtn" onclick="installKtimesApp()" class="hidden px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm items-center gap-1">

        <button onclick="openAdminModal()" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold">Admin</button>
      </div>
    </div>

    <!-- 2. SOCIAL ICONS + LOCATION BAR -->
    <div class="border-t border-slate-100 bg-slate-50/90 px-4 py-1.5">
      <div class="max-w-6xl mx-auto flex items-center justify-between gap-2 overflow-x-auto scrollbar-none" id="socialIconsBar"></div>
    </div>
  </header>

  <!-- 3. FESTIVAL OFFER BANNER WITH BIG TIMER -->
  <section class="max-w-6xl mx-auto px-4 pt-3 pb-1 w-full" id="offerBannerSection">
    <div class="bg-gradient-to-r from-purple-950 via-purple-900 to-indigo-950 rounded-2xl p-4 md:p-5 text-white shadow-lg border border-purple-800 space-y-3">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div class="space-y-1">
          <span class="bg-yellow-400 text-purple-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">✨ चालू ऑफर</span>
          <h2 class="baloo-k text-lg md:text-xl font-bold text-white leading-tight" id="bannerTitleDisplay">फेस्टिव्हल विशेष ऑफर - सर्व जाहिरातींवर ३०% सूट!</h2>
          <p class="text-xs text-purple-200" id="bannerSubDisplay">दर्जेदार ऑडिओ, 4K व्हिडिओ व व्यावसायिक जिंगल्स</p>
          <div class="text-xs text-amber-300 baloo-k font-bold pt-1" id="bannerDateRangeDisplay">कालावधी: १५ ऑगस्ट ते ३१ ऑगस्ट २०२६</div>
        </div>

        <div class="flex flex-col items-center md:items-end gap-1.5 shrink-0">
          <div id="liveCountdownTimer" class="text-2xl md:text-3xl font-black baloo-k text-yellow-300 tracking-wider">--d --h --m --s</div>
          <a href="https://wa.me/919422337471?text=मी%20फेस्टिव्हल%20ऑफर%20विषयी%20चौकशी%20करत%20आहे" target="_blank" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center gap-1.5 shadow">
            <i data-lucide="message-circle" class="w-4 h-4"></i> ऑफर बुक करा
          </a>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-purple-800/80 text-[11px]">
        <a href="tel:9422337471" class="font-bold text-yellow-300 flex items-center gap-1">
          <i data-lucide="phone-call" class="w-3.5 h-3.5"></i> 9422337471
        </a>
        <div class="font-bold text-purple-200 bg-purple-900/80 px-2.5 py-1 rounded-lg border border-purple-700">
          <span id="bannerViewsDisplay">3480</span> व्हिजिटर्स
        </div>
      </div>
    </div>
  </section>

  <!-- 4. CATEGORY TABS -->
  <section class="max-w-6xl mx-auto px-4 pt-2 pb-1 w-full">
    <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
      <div class="flex items-center justify-between gap-1.5 overflow-x-auto pb-0.5 scrollbar-none" id="categoryTabsContainer"></div>
    </div>
  </section>

  <!-- 5. SAMPLES GRID -->
  <main class="max-w-6xl mx-auto px-4 py-3 w-full flex-grow">
    <div id="samplesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-stretch"></div>
  </main>

  <!-- 6. 5-BUTTON MOBILE BOTTOM NAV -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 py-1.5 flex items-center justify-around text-[10px] font-semibold text-slate-600 shadow-lg">
    <button onclick="filterCategoryBySlug('ऑडिओ')" class="flex flex-col items-center gap-0.5 text-slate-700">
      <i data-lucide="mic" class="w-5 h-5 text-red-600"></i>
      <span>ऑडिओ</span>
    </button>
    <button onclick="filterCategoryBySlug('व्हिडिओ')" class="flex flex-col items-center gap-0.5 text-slate-700">
      <i data-lucide="video" class="w-5 h-5 text-purple-600"></i>
      <span>व्हिडिओ</span>
    </button>
    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center gap-0.5 text-red-600 font-bold scale-110">
      <div class="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center shadow-md">
        <i data-lucide="home" class="w-4 h-4"></i>
      </div>
      <span>होम</span>
    </button>
    <button onclick="filterCategoryBySlug('जिंगल्स')" class="flex flex-col items-center gap-0.5 text-slate-700">
      <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i>
      <span>जिंगल्स</span>

    <a href="tel:9422337471" class="flex flex-col items-center gap-0.5 text-emerald-600">
      <i data-lucide="phone-call" class="w-5 h-5"></i>
      <span>कॉल करा</span>
    </a>
  </div>

  <!-- 7. ADMIN MODAL -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-slate-900">Ktimes Admin Panel</h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div id="adminLockScreen" class="space-y-3 py-4 text-center">
        <input type="password" id="adminPinInput" placeholder="PIN" maxlength="8" class="w-40 mx-auto px-4 py-2 border-2 rounded-xl text-center text-lg font-bold outline-none focus:border-red-600 block">
        <button onclick="verifyAdminPin()" class="w-full py-2 bg-red-600 text-white rounded-xl font-bold text-xs shadow">लॉगिन</button>
      </div>

      <div id="adminUnlockedArea" class="hidden space-y-4 text-xs">
        <!-- Banner Settings -->
        <div class="bg-purple-50 p-3 rounded-xl border border-purple-200 space-y-2">
          <label class="font-bold text-purple-950 block uppercase">फेस्टिव्हल ऑफर सेटिंग</label>
          <input type="text" id="offerBannerTitle" placeholder="शीर्षक" class="w-full p-2 border rounded-lg">
          <input type="text" id="offerBannerSub" placeholder="तपशील" class="w-full p-2 border rounded-lg">
          <input type="text" id="offerDateText" placeholder="कालावधी मजकूर (उदा. १५ ते ३१ ऑगस्ट)" class="w-full p-2 border rounded-lg">
          <input type="datetime-local" id="offerEndTime" class="w-full p-2 border rounded-lg">
          <input type="number" id="offerBannerViews" placeholder="व्हिजिटर्स संख्या" class="w-full p-2 border rounded-lg">
          <button onclick="saveOfferSettings()" class="w-full py-1.5 bg-purple-700 text-white font-bold rounded-lg">ऑफर सेव्ह करा</button>
        </div>

        <!-- Social Links Settings -->
        <div class="bg-slate-50 p-3 rounded-xl border space-y-2">
          <label class="font-bold block uppercase">सोशल मीडिया लिंक्स</label>
          <input type="url" id="link_wa_comm" placeholder="WhatsApp Community Link" class="w-full p-1.5 border rounded">
          <input type="url" id="link_wa_chan" placeholder="WhatsApp Channel Link" class="w-full p-1.5 border rounded">
          <input type="url" id="link_yt" placeholder="YouTube Link" class="w-full p-1.5 border rounded">
          <input type="url" id="link_insta" placeholder="Instagram Link" class="w-full p-1.5 border rounded">
          <input type="url" id="link_fb" placeholder="Facebook Link" class="w-full p-1.5 border rounded">
          <input type="url" id="link_linkedin" placeholder="LinkedIn Link" class="w-full p-1.5 border rounded">
          <input type="url" id="link_x" placeholder="X (Twitter) Link" class="w-full p-1.5 border rounded">
          <button onclick="saveSocialLinks()" class="w-full py-1.5 bg-slate-800 text-white font-bold rounded">लिंक्स सेव्ह करा</button>
        </div>

        <!-- Add Sample Form -->
        <form onsubmit="handleSaveSample(event)" class="space-y-2 pt-2 border-t">
          <label class="font-bold block uppercase">नवीन सॅम्पल जोडा</label>
          <input type="text" id="sampleTitle" required placeholder="सॅम्पल नाव" class="w-full p-2 border rounded-lg">
          <select id="sampleCategory" class="w-full p-2 border rounded-lg"></select>
          <input type="text" id="sampleUrl" placeholder="YouTube Video Link किंवा ID" class="w-full p-2 border rounded-lg">
          <button type="submit" class="w-full py-2 bg-red-600 text-white font-bold rounded-lg">+ सॅम्पल पब्लिश करा</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SOCIALS = {
      wa_comm: "https://chat.whatsapp.com/your-link",
      wa_chan: "https://whatsapp.com/channel/your-link",
      yt: "https://www.youtube.com/@KtimesMedia",
      insta: "https://instagram.com",
      fb: "https://facebook.com",
      linkedin: "https://linkedin.com",
      x: "https://x.com"
    };

    const DEFAULT_OFFER = {
      title: "फेस्टिव्हल विशेष ऑफर - सर्व जाहिरातींवर ३०% सूट!",
      sub: "दर्जेदार ऑडिओ, 4K व्हिडिओ व व्यावसायिक जिंगल्स",
      dateText: "१५ ऑगस्ट ते ३१ ऑगस्ट २०२६",
      endTime: "2026-08-31T23:59:59",
      views: 3480
    };

    const DEFAULT_CATEGORIES = ['All', 'व्हिडिओ (Video Ads)', 'ऑडिओ (Voice Over)', 'जिंगल्स (Jingles)', 'Reels / Shorts'];

    const INITIAL_SAMPLES = [
      { id: 's1', title: 'गणेश ज्वेलर्स - फेस्टिव्हल टीव्ही कमर्शियल जाहिरात', category: 'व्हिडिओ (Video Ads)', url: 'dQw4w9WgXcQ', views: 1840, likes: 215 },
      { id: 's2', title: 'मल्टीस्पेशालिटी हॉस्पिटल - रेडिओ व्हॉईस ओव्हर', category: 'ऑडिओ (Voice Over)', url: 'dQw4w9WgXcQ', views: 1220, likes: 148 }
    ];

    let currentPin = localStorage.getItem('ktimes_admin_pin') || '7171';
    let categories = JSON.parse(localStorage.getItem('ktimes_categories_db')) || DEFAULT_CATEGORIES;
    let socialLinks = JSON.parse(localStorage.getItem('ktimes_socials_db')) || DEFAULT_SOCIALS;
    let offerSettings = JSON.parse(localStorage.getItem('ktimes_offer_db')) || DEFAULT_OFFER;
    let userLikedList = JSON.parse(localStorage.getItem('ktimes_user_likes')) || [];
    let activeCategory = 'All';
    let deferredPrompt;

    function getStoredSamples() {
      const stored = localStorage.getItem('ktimes_samples_db');
      return stored ? JSON.parse(stored) : INITIAL_SAMPLES;
    }

    function saveStoredSamples(data) {
      localStorage.setItem('ktimes_samples_db', JSON.stringify(data));
      renderSamples();
    }

    function renderSocialIconsBar() {
      document.getElementById('socialIconsBar').innerHTML = `
        <div class="flex items-center gap-1 text-[11px] font-bold text-slate-700 bg-white px-2 py-1 rounded-lg border border-slate-200 shadow-sm shrink-0">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-red-600"></i>
          <span>सातारा</span>
        </div>

        <a href="${socialLinks.wa_comm}" target="_blank" class="flex items-center gap-1 px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-sm shrink-0">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-5.46-4.45-9.92-9.91-9.92z"/></svg>
          कम्युनिटी
        </a>
        
        <div class="flex items-center gap-1.5 shrink-0">
          <a href="${socialLinks.wa_chan}" target="_blank" title="WhatsApp Channel" class="w-7 h-7 rounded-lg bg-emerald-500 text-white flex items-center justify-center shadow-sm"><svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.35 5L2 22l5.12-1.33c1.43.82 3.09 1.33 4.88 1.33 5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg></a>
          <a href="${socialLinks.yt}" target="_blank" title="YouTube" class="w-7 h-7 rounded-lg bg-[#FF0000] text-white flex items-center justify-center shadow-sm"><svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
          <a href="${socialLinks.insta}" target="_blank" title="Instagram" class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white flex items-center justify-center shadow-sm"><svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069z"/></svg></a>
          <a href="${socialLinks.fb}" target="_blank" title="Facebook" class="w-7 h-7 rounded-lg bg-[#1877F2] text-white flex items-center justify-center shadow-sm"><svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
          <a href="${socialLinks.linkedin}" target="_blank" title="LinkedIn" class="w-7 h-7 rounded-lg bg-[#0A66C2] text-white flex items-center justify-center shadow-sm"><svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>
          <a href="${socialLinks.x}" target="_blank" title="X" class="w-7 h-7 rounded-lg bg-black text-white flex items-center justify-center shadow-sm"><svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
        </div>
      `;
      lucide.createIcons();
    }

    function updateCountdownTimer() {
      const targetTime = new Date(offerSettings.endTime || "2026-08-31T23:59:59").getTime();
      const diff = targetTime - new Date().getTime();
      const timerEl = document.getElementById('liveCountdownTimer');
      if (!timerEl) return;

      if (diff <= 0) {
        timerEl.innerText = "ऑफर समाप्त";
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      timerEl.innerText = `${d}d ${h}h ${m}m ${s}s`;
    }

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabsContainer');
      const select = document.getElementById('sampleCategory');
      container.innerHTML = '';
      select.innerHTML = '';

      categories.forEach(cat => {
        const isActive = activeCategory === cat;
        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap ${
          isActive ? 'bg-red-600 text-white' : 'bg-slate-50 text-slate-700 border'
        }`;
        btn.innerText = cat;
        btn.onclick = () => { activeCategory = cat; renderCategoryTabs(); renderSamples(); };
        container.appendChild(btn);

        if (cat !== 'All') {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.innerText = cat;
          select.appendChild(opt);
        }
      });
    }

    function filterCategoryBySlug(slug) {
      const found = categories.find(c => c.includes(slug));
      if (found) {
        activeCategory = found;
        renderCategoryTabs();
        renderSamples();
        window.scrollTo({top: 250, behavior: 'smooth'});
      }
    }

    function getYouTubeId(url) {
      if (!url) return '';
      if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split(/[?#]/)[0];
      if (url.includes('watch?v=')) return url.split('watch?v=')[1].split(/[&#]/)[0];
      if (url.includes('embed/')) return url.split('embed/')[1].split(/[?#]/)[0];
      return url;
    }

    function renderSamples() {
      const grid = document.getElementById('samplesGrid');
      const samples = getStoredSamples();
      const filtered = activeCategory === 'All' 
        ? samples 
        : samples.filter(s => s.category && s.category.includes(activeCategory));

      grid.innerHTML = filtered.map(s => {
        const vid = getYouTubeId(s.url);
        const isLiked = userLikedList.includes(s.id);
        return `
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between gap-3">
            <div>
              <span class="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-full border border-red-100">${s.category || 'Production'}</span>
              <h3 class="font-bold text-sm text-slate-900 mt-1 mb-2">${s.title}</h3>
              <iframe class="w-full aspect-video rounded-xl bg-black" src="https://www.youtube-nocookie.com/embed/${vid}" frameborder="0" allowfullscreen></iframe>
              <div class="flex justify-between items-center mt-3 text-xs font-bold text-slate-600">
                <span>👁️ ${s.views || 100} व्ह्यूज</span>
                <button onclick="toggleLike('${s.id}')" class="${isLiked ? 'text-rose-600' : 'text-slate-500'}">❤️ ${s.likes || 10}</button>
              </div>
            </div>
            <div class="flex gap-2 pt-2 border-t">
              <button onclick="shareLink('${s.title}')" class="flex-1 py-1.5 bg-slate-100 rounded-xl text-xs font-bold flex items-center justify-center gap-1"><i data-lucide="share-2" class="w-3.5 h-3.5"></i> शेअर</button>
              <a href="https://wa.me/919422337471?text=मला%20याबद्दल%20माहिती%20हवी%20आहे:%20${encodeURIComponent(s.title)}" target="_blank" class="flex-1 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1">विचारणा</a>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function toggleLike(id) {
      const list = getStoredSamples();
      const item = list.find(s => s.id === id);
      if (!item) return;
      if (userLikedList.includes(id)) {
        userLikedList = userLikedList.filter(x => x !== id);
        item.likes = Math.max(0, (item.likes || 1) - 1);
      } else {
        userLikedList.push(id);
        item.likes = (item.likes || 0) + 1;
      }
      localStorage.setItem('ktimes_user_likes', JSON.stringify(userLikedList));
      saveStoredSamples(list);
    }

    function shareLink(title) {
      if (navigator.share) {
        navigator.share({ title: title, url: window.location.href });
      } else {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(title + ' ' + window.location.href)}`, '_blank');
      }
    }

    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
      document.getElementById('adminModal').classList.add('flex');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
      document.getElementById('adminModal').classList.remove('flex');
    }

    function verifyAdminPin() {
      if (document.getElementById('adminPinInput').value === currentPin) {
        document.getElementById('adminLockScreen').classList.add('hidden');
        document.getElementById('adminUnlockedArea').classList.remove('hidden');
        document.getElementById('offerBannerTitle').value = offerSettings.title || '';
        document.getElementById('offerBannerSub').value = offerSettings.sub || '';
        document.getElementById('offerDateText').value = offerSettings.dateText || '';
        document.getElementById('offerEndTime').value = offerSettings.endTime || '';
        document.getElementById('offerBannerViews').value = offerSettings.views || 3480;
        document.getElementById('link_wa_comm').value = socialLinks.wa_comm || '';
        document.getElementById('link_wa_chan').value = socialLinks.wa_chan || '';
        document.getElementById('link_yt').value = socialLinks.yt || '';
        document.getElementById('link_insta').value = socialLinks.insta || '';
        document.getElementById('link_fb').value = socialLinks.fb || '';
        document.getElementById('link_linkedin').value = socialLinks.linkedin || '';
        document.getElementById('link_x').value = socialLinks.x || '';
      } else {
        alert('चुकीचा पिन!');
      }
    }

    function saveOfferSettings() {
      offerSettings.title = document.getElementById('offerBannerTitle').value;
      offerSettings.sub = document.getElementById('offerBannerSub').value;
      offerSettings.dateText = document.getElementById('offerDateText').value;
      offerSettings.endTime = document.getElementById('offerEndTime').value;
      offerSettings.views = document.getElementById('offerBannerViews').value;
      localStorage.setItem('ktimes_offer_db', JSON.stringify(offerSettings));
      
      document.getElementById('bannerTitleDisplay').innerText = offerSettings.title;
      document.getElementById('bannerSubDisplay').innerText = offerSettings.sub;
      document.getElementById('bannerDateRangeDisplay').innerText = "कालावधी: " + offerSettings.dateText;
      document.getElementById('bannerViewsDisplay').innerText = offerSettings.views;
      alert('ऑफर अपडेट झाली!');
    }

    function saveSocialLinks() {
      socialLinks = {
        wa_comm: document.getElementById('link_wa_comm').value,
        wa_chan: document.getElementById('link_wa_chan').value,
        yt: document.getElementById('link_yt').value,
        insta: document.getElementById('link_insta').value,
        fb: document.getElementById('link_fb').value,
        linkedin: document.getElementById('link_linkedin').value,
        x: document.getElementById('link_x').value
      };
      localStorage.setItem('ktimes_socials_db', JSON.stringify(socialLinks));
      renderSocialIconsBar();
      alert('सोशल लिंक्स सेव्ह झाल्या!');
    }

    function handleSaveSample(e) {
      e.preventDefault();
      const list = getStoredSamples();
      list.unshift({
        id: 's_' + Date.now(),
        title: document.getElementById('sampleTitle').value,
        category: document.getElementById('sampleCategory').value,
        url: document.getElementById('sampleUrl').value,
        views: 1200,
        likes: 95
      });
      saveStoredSamples(list);
      alert('सॅम्पल पब्लिश झाले!');
      closeAdminModal();
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwaInstallBtn').classList.remove('hidden');
      document.getElementById('pwaInstallBtn').classList.add('flex');
    });

    function installKtimesApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
      }
    }

    window.onload = () => {
      renderSocialIconsBar();
      renderCategoryTabs();
      renderSamples();
      setInterval(updateCountdownTimer, 1000);
      updateCountdownTimer();
    };
  </script>
</body>
</html>
