<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ktimes Media | Professional Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Mukta', sans-serif; -webkit-tap-highlight-color: transparent; }
    .baloo-font { font-family: 'Baloo 2', sans-serif; }
    .ktimes-dial { background: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; }
    #splash-screen { position: fixed; inset: 0; z-index: 9999; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    .hide-splash { opacity: 0; visibility: hidden; }
    /* Like Animation */
    .heart-pulse { transition: transform 0.2s; }
    .heart-pulse:active { transform: scale(1.4); }
  </style>
</head>
<body class="bg-slate-50 pb-24 md:pb-6">

  <!-- Splash -->
  <div id="splash-screen"><div class="ktimes-dial w-24 h-24 ring-4 ring-red-100"><span class="baloo-font text-white text-6xl italic">K</span></div></div>

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2"><div class="ktimes-dial w-9 h-9"><span class="baloo-font text-white text-xl italic">K</span></div>
      <h1 class="font-bold text-lg">Ktimes <span class="text-red-600">Media</span></h1></div>
      <button onclick="openAdminModal()" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs font-bold">Admin</button>
    </div>
    <div class="px-4 py-2 flex justify-center gap-4 bg-slate-50 border-t" id="socialIconsBar"></div>
  </header>

  <!-- Banner -->
  <section class="max-w-4xl mx-auto px-4 pt-4" id="offerBannerSection"></section>

  <!-- Categories -->
  <section class="max-w-4xl mx-auto px-4 py-3"><div class="flex gap-2 overflow-x-auto" id="categoryTabsContainer"></div></section>

  <!-- Samples -->
  <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-4" id="samplesGrid"></main>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 max-h-[80vh] overflow-y-auto">
        <h2 class="font-bold mb-4">Admin Panel</h2>
        <input type="password" id="adminPinInput" placeholder="Enter PIN" class="w-full p-2 border mb-2 text-center tracking-widest">
        <button onclick="verifyAdminPin()" class="w-full bg-red-600 text-white p-2 rounded">Login</button>
        <div id="adminUnlockedArea" class="hidden mt-4 space-y-2">
            <input type="text" id="sampleTitle" placeholder="Title" class="w-full p-2 border">
            <input type="text" id="sampleMediaUrl" placeholder="URL" class="w-full p-2 border">
            <label class="text-xs">ऑफर शेवटची तारीख:</label>
            <input type="date" id="offerDate" class="w-full p-2 border">
            <button onclick="handleSaveSample()" class="w-full bg-green-600 text-white p-2">Save Settings</button>
        </div>
    </div>
  </div>

  <script>
    let samples = JSON.parse(localStorage.getItem('ktimes_samples_db')) || [{id:'s1', title:'गणेश ज्वेलर्स', category:'Video', url:'#', views:1420, likes:184}];
    let offer = JSON.parse(localStorage.getItem('ktimes_offer')) || {title: 'Festival Offer', end: '2026-09-01'};

    function renderOffer() {
      const banner = document.getElementById('offerBannerSection');
      const endDate = new Date(offer.end).getTime();
      const now = new Date().getTime();
      const diff = endDate - now;
      
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      banner.innerHTML = `
        <div class="bg-purple-900 p-4 rounded-2xl text-white flex justify-between items-center">
            <div>
                <h2 class="font-bold text-sm">${offer.title}</h2>
                <p class="baloo-font text-xs text-yellow-300">End: ${offer.end}</p>
                <div class="text-lg font-black mt-1">${days}d ${hours}h left</div>
            </div>
            <a href="tel:9422337471" class="bg-yellow-400 text-black px-4 py-2 rounded-xl font-bold text-xs">Call Now</a>
        </div>
      `;
    }

    function renderSamples() {
      document.getElementById('samplesGrid').innerHTML = samples.map(s => `
        <div class="bg-white p-4 rounded-xl border shadow-sm">
           <h3 class="font-bold text-sm mb-2">${s.title}</h3>
           <div class="flex justify-between items-center text-xs font-bold">
             <span class="text-blue-600">👁️ ${s.views}</span>
             <button onclick="toggleLike('${s.id}')" class="heart-pulse flex items-center gap-1 text-rose-600">❤️ ${s.likes}</button>
           </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function toggleLike(id) {
       let s = samples.find(x => x.id === id);
       s.likes++;
       renderSamples();
    }

    function verifyAdminPin() {
      if(document.getElementById('adminPinInput').value === '7171') {
        document.getElementById('adminUnlockedArea').classList.remove('hidden');
      } else { alert('Wrong PIN'); }
    }

    function handleSaveSample() {
        offer.end = document.getElementById('offerDate').value;
        localStorage.setItem('ktimes_offer', JSON.stringify(offer));
        renderOffer();
        alert('Saved!');
    }

    window.onload = () => {
      renderOffer();
      renderSamples();
      setInterval(renderOffer, 60000); // Update timer every min
      setTimeout(() => document.getElementById('splash-screen').classList.add('hide-splash'), 1000);
      lucide.createIcons();
    };
  </script>
</body>
</html>
