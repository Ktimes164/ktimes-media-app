<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ktimes Media | Official App</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Mukta', sans-serif; }
    .baloo-k { font-family: 'Baloo 2', sans-serif; }
    #splash-screen { position: fixed; inset: 0; z-index: 9999; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
  </style>
</head>
<body class="bg-slate-50 pb-24">

  <!-- Splash Screen -->
  <div id="splash-screen"><div class="text-6xl animate-bounce">🎬</div><p class="font-bold mt-2">Ktimes Media Loading...</p></div>

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2"><div class="w-9 h-9 bg-red-600 rounded-full flex items-center justify-center text-white font-black italic">K</div>
      <h1 class="font-bold text-lg">Ktimes <span class="text-red-600">Media</span></h1></div>
      <div class="flex gap-2">
        <button id="pwaInstallBtn" onclick="installKtimesApp()" class="hidden bg-emerald-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold shadow animate-pulse">⬇️ इन्स्टॉल</button>
        <button onclick="openAdminModal()" class="px-3 py-1 bg-red-700 text-white rounded-lg text-xs font-bold">Admin</button>
      </div>
    </div>
  </header>

  <!-- Banner (Color & Content Customizable) -->
  <section class="max-w-4xl mx-auto px-4 pt-4">
    <div id="offerBanner" class="p-6 rounded-2xl text-white shadow-lg text-center" style="background-color: #7e22ce;">
        <h2 class="baloo-k text-2xl font-black mb-2" id="bannerTitle">फेस्टिव्हल ऑफर - ३०% सूट!</h2>
        <p class="text-sm font-semibold opacity-90 mb-4" id="bannerSub">आमच्या सर्व जाहिरातींवर खास सवलत.</p>
        <a href="tel:9422337471" class="inline-block bg-white text-black px-6 py-2 rounded-xl font-black text-sm">आत्ताच कॉल करा</a>
    </div>
  </section>

  <main class="max-w-4xl mx-auto px-4 py-4 grid grid-cols-1 md:grid-cols-2 gap-4" id="samplesGrid"></main>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto p-5">
        <h2 class="font-bold mb-4 border-b pb-2">ॲडमिन सेटिंग्स</h2>
        <input type="password" id="adminPin" placeholder="PIN" class="w-full p-2 border mb-2 text-center text-lg">
        <button onclick="verifyAdminPin()" class="w-full bg-red-700 text-white p-2 rounded">Login</button>
        <div id="adminControls" class="hidden mt-4 space-y-3">
            <input type="text" id="a_title" placeholder="Banner Title" class="w-full p-2 border">
            <input type="color" id="a_color" class="w-full h-10">
            <input type="file" id="a_image" class="w-full p-2 text-xs">
            <hr>
            <input type="text" id="s_title" placeholder="Sample Title" class="w-full p-2 border">
            <input type="text" id="s_url" placeholder="Video Link/ID" class="w-full p-2 border">
            <input type="file" id="a_audio" class="w-full p-2 text-xs">
            <button onclick="saveAdminData()" class="w-full bg-green-600 text-white p-2">Save All Changes</button>
        </div>
    </div>
  </div>

  <script>
    let samples = JSON.parse(localStorage.getItem('ktimes_samples_db')) || [{id:'s1', title:'गणेश ज्वेलर्स', vid:'dQw4w9WgXcQ', type:'video'}];
    let banner = JSON.parse(localStorage.getItem('ktimes_banner')) || {title:'फेस्टिव्हल ऑफर', sub:'३०% सूट', color:'#7e22ce'};

    function renderSamples() {
      document.getElementById('samplesGrid').innerHTML = samples.map(s => `
        <div class="bg-white p-4 rounded-xl border shadow-sm">
           <h3 class="font-bold text-sm mb-2">${s.title}</h3>
           ${s.type === 'video' ? `<iframe class="w-full aspect-video rounded-lg" src="https://www.youtube.com/embed/${s.vid}"></iframe>` : `<audio controls class="w-full"><source src="${s.vid}"></audio>`}
        </div>
      `).join('');
    }

    function saveAdminData() {
        banner.title = document.getElementById('a_title').value;
        banner.color = document.getElementById('a_color').value;
        localStorage.setItem('ktimes_banner', JSON.stringify(banner));
        
        // Samples logic
        samples.unshift({id:'s'+Date.now(), title:document.getElementById('s_title').value, vid:document.getElementById('s_url').value, type:'video'});
        localStorage.setItem('ktimes_samples_db', JSON.stringify(samples));
        
        location.reload();
    }

    function verifyAdminPin() {
        if(document.getElementById('adminPin').value === '7171') document.getElementById('adminControls').classList.remove('hidden');
        else alert('Wrong PIN');
    }

    // PWA Logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('pwaInstallBtn').classList.remove('hidden'); });
    function installKtimesApp() { if(deferredPrompt) deferredPrompt.prompt(); }

    window.onload = () => {
        document.getElementById('offerBanner').style.backgroundColor = banner.color;
        document.getElementById('bannerTitle').innerText = banner.title;
        renderSamples();
        setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 1000);
    };
    function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); document.getElementById('adminModal').classList.add('flex'); }
  </script>
</body>
</html>
